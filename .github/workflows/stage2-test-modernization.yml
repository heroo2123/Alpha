name: stage2-test-modernization
on:
  push:
    branches: [weather-all-paper-stage2-findings-5-7-2026-09-16]
    paths: ['.github/workflows/stage2-test-modernization.yml']
permissions:
  contents: write
jobs:
  patch-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-all-paper-stage2-findings-5-7-2026-09-16
      - name: Replace superseded V4/V9 trust assertions with current stronger invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_test(path: str, name: str, source: str) -> None:
              p=Path(path); text=p.read_text()
              pattern=re.compile(rf"(?ms)^def {re.escape(name)}\([^\n]*\):\n.*?(?=^def |\Z)")
              matches=list(pattern.finditer(text))
              if len(matches)!=1:
                  raise SystemExit(f'{path}:{name}: expected 1 function, found {len(matches)}')
              m=matches[0]
              text=text[:m.start()]+source.rstrip()+"\n\n"+text[m.end():]
              p.write_text(text)

