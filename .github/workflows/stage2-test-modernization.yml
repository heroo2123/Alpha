    from polymarket_scanner.weather_only_maker_paper_accounting_v6 import MakerPaperAccountingStoreV6, LEGACY_QUEUE_UNCERTIFIED
    from polymarket_scanner.weather_only_maker_shadow import VirtualMakerOrder, WEATHER_MAKER_SHADOW_VERSION, CANCELLED
    db=tmp_path/'maker.sqlite'
    order=VirtualMakerOrder(version=WEATHER_MAKER_SHADOW_VERSION,order_id='legacy',policy_id='p',event_id='e',market_id='m',condition_id='c',token_id='t',outcome='YES',bid_price=.4,shares=10,created_at=1,expires_at=2,fair_model_version='f',fair_evidence_sha256='a'*64,fair_as_of=1,contract_evidence_sha256='b'*64,source_generation='legacy',market_parameter_sha256='c'*64,created_book_hash='book',created_book_received_at=1,queue_ahead_shares=0,simulated_filled_shares=10,processed_trade_ids=('x',),status=CANCELLED)
    old=MakerPaperAccountingStore(db); old.save_new_order(order,recorded_at=1); before=old.record_settlement(order,payout_per_share=1,evidence={'source':'fixture'},settled_at=3); old.close()
    assert before['paper_pnl'] == 6.0
    s=MakerPaperAccountingStoreV6(db)
    assert s.evidence_class('legacy') == LEGACY_QUEUE_UNCERTIFIED
    grouped=s.maker_performance_by_evidence()
    assert grouped['validated']['pnl'] == 0 and grouped['validated']['capital'] == 0
    assert grouped['legacy_excluded']['pnl'] == 6.0 and grouped['legacy_excluded']['capital'] == 4.0
    assert s.settlement('legacy') == before
    s.close()
