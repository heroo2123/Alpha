name: stage2-test-modernization

on:
  push:
    branches:
      - weather-all-paper-stage2-findings-5-7-2026-09-16
    paths:
      - '.github/workflows/stage2-test-modernization.yml'

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-all-paper-stage2-findings-5-7-2026-09-16
      - name: Apply current-invariant test replacements
        run: python tools/stage2_remove_superseded_tests.py
      - name: Verify and commit replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q tests
          git diff --check
          git config user.name 'Stage2 Corrective Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests
          git commit -m 'Replace superseded trust tests with current independent-authority coverage'
          git push origin HEAD:weather-all-paper-stage2-findings-5-7-2026-09-16
# one-shot trigger; remove after generated commit
