name: three-layer-strict-v6-hardening

on:
  push:
    branches:
      - weather-three-layer-dst-hardening-2026-09-15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'Harden current recurring weather grammar v6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strict v6 grammar patch
        run: python tools/apply_strict_v6_live_grammar.py
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused adversarial regressions
        run: |
          python -m pytest -q \
            tests/test_weather_only_contract_strict_v6.py \
            tests/test_weather_final_adversarial_blockers.py \
            tests/test_weather_final_gpt6_exact_replays.py \
            tests/test_weather_gpt6_exact_b1_b6_regressions.py \
            tests/test_weather_gpt6_b1_b6_exact_followup.py \
            tests/test_weather_gpt6_interrupted_followup.py \
            tests/test_weather_only_three_layer_validation_guarded.py
          python -m compileall -q polymarket_scanner tests
      - name: Prove current live WRH recurring universe is admitted by exact grammar
        run: |
          python - <<'PY'
          import asyncio
          from collections import Counter
          from polymarket_scanner.weather_only_discovery import WeatherOnlyDiscovery
          from polymarket_scanner.weather_only_contracts import DAILY_HIGH, DAILY_LOW, compile_weather_event
          from polymarket_scanner.weather_only_contract_strict import compile_strict_temperature_event

          def code(exc):
              return str(getattr(exc, 'code', type(exc).__name__))

          async def main():
              d = WeatherOnlyDiscovery()
              try:
                  snapshot = await d.discover()
                  raw = []
                  passed = []
                  failures = Counter()
                  samples = []
                  for event in snapshot.events:
                      if not isinstance(event, dict):
                          continue
                      broad = compile_weather_event(event)
                      if not (broad.family in {DAILY_HIGH, DAILY_LOW} and broad.source_family == 'NWS_WRH_TIMESERIES'):
                          continue
                      raw.append(str(broad.event_id))
                      try:
                          strict = compile_strict_temperature_event(event)
                      except Exception as exc:
                          failures[code(exc)] += 1
                          if len(samples) < 20:
                              samples.append((broad.event_id, broad.title, code(exc)))
                          continue
                      assert strict.financial_authority is False
                      passed.append(str(strict.event_id))
                  print(f'LIVE_DISCOVERED={snapshot.unique_event_count}')
                  print(f'LIVE_WRH_TEMP={len(raw)}')
                  print(f'LIVE_STRICT_PASS={len(passed)}')
                  print('LIVE_STRICT_FAILURES=' + repr(dict(failures)))
                  print('LIVE_STRICT_FAILURE_SAMPLES=' + repr(samples))
                  assert raw, 'NO_LIVE_WRH_TEMPERATURE_CONTRACTS'
                  assert len(passed) == len(raw), (len(raw), len(passed), failures, samples)
                  assert set(passed) == set(raw)
                  print('LIVE_STRICT_V6_UNIVERSE_PASS')
              finally:
                  await d.close()

          asyncio.run(main())
          PY
      - name: Commit only reviewed production and permanent regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add polymarket_scanner/weather_only_contract_strict.py tests/test_weather_only_contract_strict_v6.py
          git diff --cached --check
          git commit -m 'Harden current recurring weather grammar v6'
          git push origin HEAD:weather-three-layer-dst-hardening-2026-09-15
