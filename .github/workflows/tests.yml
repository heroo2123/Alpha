name: tests

on:
  push:
  pull_request:

jobs:
  runtime-hash-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Generate exact Ubuntu x86_64 runtime wheel hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f requirements-runtime-hashed.txt || { echo 'committed runtime hash lock missing' >&2; exit 1; }
          out="generated-runtime-hashed.txt"
          : > "$out"
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            row="${raw%%#*}"
            row="$(printf '%s' "$row" | xargs)"
            [[ -z "$row" ]] && continue
            [[ "$row" == *"=="* ]] || { echo "unfrozen runtime requirement: $row" >&2; exit 1; }
            tmp="$(mktemp -d)"
            python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest "$tmp" "$row"
            mapfile -t files < <(find "$tmp" -maxdepth 1 -type f -printf '%p\n')
            [[ "${#files[@]}" -eq 1 ]] || { echo "expected one wheel for $row" >&2; exit 1; }
            digest="$(sha256sum "${files[0]}" | awk '{print $1}')"
            printf '%s --hash=sha256:%s\n' "$row" "$digest" >> "$out"
            rm -rf "$tmp"
          done < requirements.txt
          echo '--- GENERATED RUNTIME HASHES ---'
          cat "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-hash-lock-py${{ matrix.python }}-ubuntu2404-x86_64
          path: generated-runtime-hashed.txt
      - name: Verify every platform wheel hash is independently pinned
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def parse(path):
              out={}
              for raw in Path(path).read_text().splitlines():
                  row=raw.split('#',1)[0].strip()
                  if not row: continue
                  head=row.split()[0]
                  hashes={part.split(':',1)[1] for part in row.split() if part.startswith('--hash=sha256:')}
                  out[head]=hashes
              return out
          committed=parse('requirements-runtime-hashed.txt')
          generated=parse('generated-runtime-hashed.txt')
          assert set(committed)==set(generated), (set(committed)^set(generated))
          missing={req: sorted(hashes-committed[req]) for req,hashes in generated.items() if not hashes <= committed[req]}
          assert not missing, missing
          print('Committed runtime lock contains the exact wheel hash for this Python/platform.')
          PY
      - name: Prove hash-locked runtime installation
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime-hashed.txt
          python -m pip check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Exact dependency lock and consistency
        run: |
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          for file in ('requirements.txt', 'requirements-dev.txt'):
              for row in Path(file).read_text().splitlines():
                  if '==' in row and not row.lstrip().startswith('#'):
                      name, expected = row.strip().split('==')
                      assert version(name.split('[')[0]) == expected, name
          print('All runtime and test pins match exactly.')
          PY
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m compileall -q app.py app_stable.py app_stable_v2.py app_trade_only.py command_worker.py command_worker_trade_only.py polymarket_scanner deploy tests host_trust
      - run: for script in deploy/*.sh deploy/oracle/*.sh deploy/gcp/*.sh host_trust/weather-paper-authority-v3/*.sh; do bash -n "$script" || exit; done
      - name: Verify rendered systemd services without starting them
        run: python tests/validate_shadow_units.py
      - name: Synthetic production-scale generation handoff
        run: python tests/validate_shadow_scale.py --output shadow-scale.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-validation-py${{ matrix.python }}
          path: |
            test-results.xml
            shadow-scale.json
