name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m py_compile app.py app_stable.py app_stable_v2.py app_trade_only.py app_trade_only_compact.py command_worker_trade_only.py polymarket_scanner/*.py
      - run: bash -n deploy/*.sh deploy/oracle/*.sh deploy/gcp/*.sh