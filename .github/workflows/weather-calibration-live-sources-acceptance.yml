name: weather-calibration-live-sources-acceptance

on:
  push:
    branches:
      - weather-wrh-prospective-collector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-weather-research-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run strict US and global WRH station metadata plus GEFS acceptance
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from polymarket_scanner.weather_only_contracts import DAILY_HIGH
          from polymarket_scanner.weather_only_forecast import (
              GEFS_TOTAL_MEMBERS,
              OPEN_METEO_GEFS_MODEL,
              OpenMeteoGEFSEnsembleClient,
          )
          from polymarket_scanner.weather_only_station_metadata import NWSStationMetadataClient
          from polymarket_scanner.weather_only_wrh_station_metadata import (
              WRH_STATION_METADATA_VERSION,
          )

          async def forecast_for(station, unit):
              target = datetime.now(ZoneInfo(station.timezone)).date() + timedelta(days=1)
              forecast = await forecast_client.daily_extreme(
                  station=station.station,
                  latitude=station.latitude,
                  longitude=station.longitude,
                  target_date=target,
                  family=DAILY_HIGH,
                  unit=unit,
                  timezone=station.timezone,
              )
              return target, forecast

          async def main():
              global forecast_client
              station_client = NWSStationMetadataClient()
              forecast_client = OpenMeteoGEFSEnsembleClient()
              try:
                  us_station = await station_client.station('KLGA')
                  global_station = await station_client.station('ZBAA')
                  us_target, us_forecast = await forecast_for(us_station, 'F')
                  global_target, global_forecast = await forecast_for(global_station, 'C')
              finally:
                  await station_client.close()
                  await forecast_client.close()

              checks = {
                  'us_station_identity': us_station.station == 'KLGA',
                  'us_station_timezone_present': bool(us_station.timezone),
                  'us_station_evidence_sha': len(us_station.evidence_sha256) == 64,
                  'us_station_no_settlement_authority': us_station.settlement_authority is False,
                  'us_station_no_calibration_authority': us_station.calibration_label_authority is False,
                  'us_station_no_financial_authority': us_station.financial_authority is False,
                  'global_station_identity': global_station.station == 'ZBAA',
                  'global_station_uses_wrh_fallback': global_station.adapter == WRH_STATION_METADATA_VERSION,
                  'global_station_timezone_present': bool(global_station.timezone),
                  'global_station_latitude_valid': -90.0 <= global_station.latitude <= 90.0,
                  'global_station_longitude_valid': -180.0 <= global_station.longitude <= 180.0,
                  'global_station_evidence_sha': len(global_station.evidence_sha256) == 64,
                  'global_station_token_not_persisted': global_station.token_persisted is False,
                  'global_station_no_settlement_authority': global_station.settlement_authority is False,
                  'global_station_no_calibration_authority': global_station.calibration_label_authority is False,
                  'global_station_no_financial_authority': global_station.financial_authority is False,
                  'us_forecast_station_match': us_forecast.station == us_station.station,
                  'us_forecast_target_match': us_forecast.target_date == us_target,
                  'us_forecast_model': us_forecast.provider_model == OPEN_METEO_GEFS_MODEL,
                  'us_forecast_member_count': len(us_forecast.member_values) == GEFS_TOTAL_MEMBERS,
                  'us_forecast_no_authority': (
                      us_forecast.settlement_authority is False
                      and us_forecast.calibration_label_authority is False
                      and us_forecast.calibrated_probability is False
                      and us_forecast.financial_authority is False
                  ),
                  'global_forecast_station_match': global_forecast.station == global_station.station,
                  'global_forecast_target_match': global_forecast.target_date == global_target,
                  'global_forecast_timezone_match': global_forecast.timezone == global_station.timezone,
                  'global_forecast_model': global_forecast.provider_model == OPEN_METEO_GEFS_MODEL,
                  'global_forecast_member_count': len(global_forecast.member_values) == GEFS_TOTAL_MEMBERS,
                  'global_forecast_no_authority': (
                      global_forecast.settlement_authority is False
                      and global_forecast.calibration_label_authority is False
                      and global_forecast.calibrated_probability is False
                      and global_forecast.financial_authority is False
                  ),
              }
              failed = sorted(name for name, ok in checks.items() if not ok)
              report = {
                  'us_station': us_station.station,
                  'us_station_adapter': us_station.adapter,
                  'us_station_timezone': us_station.timezone,
                  'us_forecast_target_date': us_target.isoformat(),
                  'us_forecast_member_count': len(us_forecast.member_values),
                  'global_station': global_station.station,
                  'global_station_adapter': global_station.adapter,
                  'global_station_timezone': global_station.timezone,
                  'global_station_latitude': global_station.latitude,
                  'global_station_longitude': global_station.longitude,
                  'global_forecast_target_date': global_target.isoformat(),
                  'global_forecast_member_count': len(global_forecast.member_values),
                  'checks': checks,
                  'browser_token_persisted': False,
                  'raw_nws_payload_persisted': False,
                  'raw_synoptic_metadata_payload_persisted': False,
                  'raw_open_meteo_payload_persisted': False,
                  'celsius_settlement_authority': False,
                  'calibration_label_authority': False,
                  'financial_authority': False,
              }
              Path('weather-calibration-live-sources.json').write_text(
                  json.dumps(report, indent=2, sort_keys=True) + '\n'
              )
              print(json.dumps(report, indent=2, sort_keys=True))
              if failed:
                  raise SystemExit('WEATHER_CALIBRATION_LIVE_SOURCES_FAILED:' + ','.join(failed))

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-calibration-live-sources-${{ github.sha }}
          path: weather-calibration-live-sources.json
          if-no-files-found: warn
