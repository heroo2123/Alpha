name: meticulous-three-layer-review-patch
# guarded station metadata preflight trigger armed

on:
  push:
    branches:
      - weather-same-day-three-layer-validation-2026-09-14

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Run guarded station metadata preflight review' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded station metadata preflight patch
        run: python tools/meticulous_three_layer_preflight_fix.py
      - name: Commit application patch locally before tests
        shell: bash
        run: |
          git config user.name "OpenAI review hardening"
          git config user.email "83580212+heroo2123@users.noreply.github.com"
          git add polymarket_scanner tests
          git diff --cached --quiet && { echo "No application changes produced"; exit 1; }
          git commit -m "Probe guarded station metadata before deployment"
      - name: Install exact test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Compile and parse deployment scripts
        shell: bash
        run: |
          python -m compileall -q app.py app_stable.py app_stable_v2.py app_trade_only.py command_worker.py command_worker_trade_only.py polymarket_scanner deploy tests
          for script in deploy/*.sh deploy/oracle/*.sh deploy/gcp/*.sh; do bash -n "$script"; done
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Push only after all review tests pass
        run: git push origin HEAD:weather-same-day-three-layer-validation-2026-09-14
