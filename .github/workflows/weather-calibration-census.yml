name: weather-calibration-census

on:
  push:
    branches:
      - weather-wrh-prospective-collector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run Gamma-only prospective calibration coverage census
        shell: bash
        run: |
          timeout 180 python -m polymarket_scanner.weather_calibration_census \
            --output weather-calibration-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-calibration-census-${{ github.sha }}
          path: weather-calibration-census.json
          if-no-files-found: error
      - name: Enforce research-only census boundary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('weather-calibration-census.json').read_text())
          required_false = (
              'database_mutation',
              'forecast_requests',
              'wrh_source_requests',
              'clob_requests',
              'financial_authority',
              'financial_delivery',
              'automatic_order_placement',
          )
          if report.get('read_only') is not True or report.get('gamma_only') is not True:
              raise SystemExit('weather calibration census lost read-only Gamma-only boundary')
          bad = [name for name in required_false if report.get(name) is not False]
          if bad:
              raise SystemExit('weather calibration census authority boundary broken:' + ','.join(bad))
          PY
