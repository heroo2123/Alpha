name: weather-maker-trade-semantics-live

on:
  workflow_dispatch:
  push:
    branches:
      - weather-all-paper-signals-2026-09-15
    paths:
      - "polymarket_scanner/weather_only_maker_trade_stream.py"
      - "polymarket_scanner/weather_only_maker_trade_stream_v2.py"
      - "tests/test_weather_maker_trade_stream.py"
      - "tests/test_weather_maker_trade_stream_identity.py"
      - ".github/workflows/weather-maker-trade-semantics-live.yml"

permissions:
  contents: read

jobs:
  live-trade-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact runtime dependencies
        run: pip install -r requirements.txt
      - name: Correlate public Market WebSocket trades with taker-only Data API
        run: |
          python - <<'PY'
          import asyncio
          import json
          import math
          import time
          import urllib.parse
          import urllib.request

          import websockets

          from polymarket_scanner.weather_only_maker_trade_stream import (
              MARKET_WS_URL,
              parse_last_trade_price_message,
          )

          GAMMA = "https://gamma-api.polymarket.com/markets"
          DATA_TRADES = "https://data-api.polymarket.com/trades"
          MAX_TOKENS = 32
          OBSERVE_SECONDS = 120.0
          CORRELATE_SECONDS = 45.0
          TARGET_WS_TRADES = 8
          MIN_CORRELATED_TRADES = 3

          def json_get(url, params):
              target = url + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  target,
                  headers={
                      "User-Agent": "weather-maker-trade-semantics-live/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert response.status == 200, response.status
                  return json.loads(response.read().decode("utf-8", errors="strict"))

          def token_ids(market):
              raw = market.get("clobTokenIds") or market.get("clob_token_ids")
              if isinstance(raw, str):
                  try:
                      raw = json.loads(raw)
                  except json.JSONDecodeError:
                      return []
              if not isinstance(raw, list):
                  return []
              return [str(value).strip() for value in raw if str(value).strip()]

          markets = json_get(
              GAMMA,
              {
                  "limit": 100,
                  "active": "true",
                  "closed": "false",
                  "order": "liquidity",
                  "ascending": "false",
              },
          )
          assert isinstance(markets, list) and markets, "no active Gamma markets"

          token_to_condition = {}
          for market in markets:
              if not isinstance(market, dict):
                  continue
              condition = str(
                  market.get("conditionId") or market.get("condition_id") or ""
              ).strip()
              if (
                  not condition.startswith("0x")
                  or len(condition) != 66
                  or any(ch.lower() not in "0123456789abcdef" for ch in condition[2:])
              ):
                  continue
              condition = "0x" + condition[2:].lower()
              for token in token_ids(market):
                  token_to_condition.setdefault(token, condition)
                  if len(token_to_condition) >= MAX_TOKENS:
                      break
              if len(token_to_condition) >= MAX_TOKENS:
                  break

          desired = sorted(token_to_condition)
          assert len(desired) >= 8, f"insufficient active public tokens: {len(desired)}"

          async def observe():
              covered = set()
              pong_seen = False
              messages = 0
              parsed = {}
              connected_at = time.time()
              deadline = time.monotonic() + OBSERVE_SECONDS
              next_ping = time.monotonic()

              async with websockets.connect(
                  MARKET_WS_URL,
                  ping_interval=None,
                  close_timeout=5,
                  open_timeout=15,
                  max_size=2 * 1024 * 1024,
                  max_queue=256,
              ) as ws:
                  await ws.send(json.dumps({
                      "assets_ids": desired,
                      "type": "market",
                      "custom_feature_enabled": False,
                  }, separators=(",", ":"), sort_keys=True))

                  while time.monotonic() < deadline and len(parsed) < TARGET_WS_TRADES:
                      now_mono = time.monotonic()
                      if now_mono >= next_ping:
                          await ws.send("PING")
                          next_ping = now_mono + 10.0
                      timeout = max(0.05, min(1.0, deadline - now_mono))
                      try:
                          raw = await asyncio.wait_for(ws.recv(), timeout=timeout)
                      except asyncio.TimeoutError:
                          continue
                      messages += 1
                      received_at = time.time()
                      if raw == "PONG" or raw == b"PONG":
                          pong_seen = True
                          continue
                      if isinstance(raw, bytes):
                          raw = raw.decode("utf-8", errors="strict")
                      body = json.loads(raw)
                      rows = body if isinstance(body, list) else [body]
                      assert all(isinstance(row, dict) for row in rows), "market WS row shape drift"

                      for row in rows:
                          event_type = str(row.get("event_type") or "")
                          if event_type == "book":
                              token = str(row.get("asset_id") or "").strip()
                              if token not in token_to_condition:
                                  continue
                              condition = str(row.get("market") or "").strip().lower()
                              assert condition == token_to_condition[token], (
                                  "book condition identity mismatch",
                                  token,
                                  condition,
                                  token_to_condition[token],
                              )
                              assert isinstance(row.get("bids"), list), "book bids schema drift"
                              assert isinstance(row.get("asks"), list), "book asks schema drift"
                              covered.add(token)
                              continue

                          if event_type != "last_trade_price":
                              continue
                          token = str(row.get("asset_id") or "").strip()
                          if token not in token_to_condition or token not in covered:
                              continue
                          condition = str(row.get("market") or "").strip().lower()
                          assert condition == token_to_condition[token], (
                              "trade condition identity mismatch",
                              token,
                              condition,
                              token_to_condition[token],
                          )

                          # This is the production parser, not a parallel workflow-only
                          # interpretation. Any required-field/schema drift fails here.
                          trade = parse_last_trade_price_message(row, received_at=received_at)
                          assert trade is not None, "production parser ignored last_trade_price"
                          tx = str(row.get("transaction_hash") or "")
                          key = (tx.lower(), trade.token_id)
                          parsed.setdefault(key, {
                              "transaction_hash": tx,
                              "token_id": trade.token_id,
                              "condition_id": condition,
                              "side": str(trade.aggressor_side),
                              "price": float(trade.price),
                              "size": float(trade.shares),
                              "executed_at": float(trade.effective_executed_at),
                              "received_at": float(trade.received_at),
                              "trade_id": trade.trade_id,
                          })

              assert pong_seen, "application heartbeat PONG not observed"
              assert covered, "no exact-token initial book coverage observed"
              assert parsed, "no post-coverage last_trade_price frame observed"
              return connected_at, covered, list(parsed.values()), messages

          connected_at, covered, observed, messages = asyncio.run(observe())

          correlation_deadline = time.monotonic() + CORRELATE_SECONDS
          correlated = {}
          mismatch = []
          while time.monotonic() < correlation_deadline:
              for item in observed:
                  key = (item["transaction_hash"].lower(), item["token_id"])
                  if key in correlated:
                      continue
                  start = max(0, int(math.floor(item["executed_at"])) - 10)
                  end = int(math.ceil(time.time())) + 10
                  rows = json_get(
                      DATA_TRADES,
                      {
                          "market": item["condition_id"],
                          "takerOnly": "true",
                          "start": start,
                          "end": end,
                          "limit": 1000,
                      },
                  )
                  assert isinstance(rows, list), "Data API trades response shape drift"
                  matches = [
                      row for row in rows
                      if isinstance(row, dict)
                      and str(row.get("transactionHash") or "").lower()
                          == item["transaction_hash"].lower()
                      and str(row.get("asset") or "").strip() == item["token_id"]
                      and str(row.get("conditionId") or "").strip().lower()
                          == item["condition_id"]
                  ]
                  if not matches:
                      continue
                  data_sides = {
                      str(row.get("side") or "").strip().upper() for row in matches
                  }
                  if data_sides != {item["side"]}:
                      mismatch.append({
                          "transaction_hash": item["transaction_hash"],
                          "token_id": item["token_id"],
                          "ws_side": item["side"],
                          "data_api_taker_sides": sorted(data_sides),
                      })
                      continue
                  correlated[key] = {
                      "transaction_hash": item["transaction_hash"],
                      "token_id": item["token_id"],
                      "condition_id": item["condition_id"],
                      "side": item["side"],
                  }
              if mismatch or len(correlated) >= MIN_CORRELATED_TRADES:
                  break
              time.sleep(2.0)

          assert not mismatch, f"WS/Data API taker-side semantic mismatch: {mismatch}"
          assert len(correlated) >= MIN_CORRELATED_TRADES, (
              "insufficient independent taker-side correlations",
              len(correlated),
              len(observed),
          )

          report = {
              "public_market_ws_url": MARKET_WS_URL,
              "anonymous_connection": True,
              "subscribed_tokens": len(desired),
              "covered_tokens": len(covered),
              "messages_observed": messages,
              "production_parsed_unique_trade_frames": len(observed),
              "data_api_taker_only_correlations": len(correlated),
              "side_semantics": "WS_SIDE_MATCHES_DATA_API_TAKER_SIDE",
              "connected_at": connected_at,
              "authenticated": False,
              "actual_fill_authority": False,
              "financial_authority": False,
              "automatic_order_placement": False,
          }
          with open("weather-maker-trade-semantics-live.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, sort_keys=True, indent=2)
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-maker-trade-semantics-live
          path: weather-maker-trade-semantics-live.json
          if-no-files-found: warn
