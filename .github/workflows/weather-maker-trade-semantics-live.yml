name: weather-maker-trade-semantics-live

on:
  workflow_dispatch:
  push:
    branches:
      - weather-all-paper-signals-2026-09-15
    paths:
      - "polymarket_scanner/weather_only_maker_trade_stream.py"
      - "polymarket_scanner/weather_only_maker_trade_stream_v2.py"
      - "polymarket_scanner/weather_only_maker_live_semantics.py"
      - "tests/test_weather_maker_trade_stream.py"
      - "tests/test_weather_maker_trade_stream_identity.py"
      - "tests/test_weather_maker_trade_stream_causality.py"
      - "tests/test_weather_maker_live_semantics.py"
      - ".github/workflows/weather-maker-trade-semantics-live.yml"

permissions:
  contents: read

jobs:
  live-trade-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact runtime dependencies
        run: pip install -r requirements.txt
      - name: Certify public maker SELL trade semantics
        run: |
          python -m polymarket_scanner.weather_only_maker_live_semantics \
            --report weather-maker-trade-semantics-live.json \
            --max-tokens 32 \
            --min-tokens 8 \
            --observe-seconds 120 \
            --correlate-seconds 45 \
            --target-ws-trades 8 \
            --min-correlated-trades 3 \
            --min-correlated-sell-trades 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-maker-trade-semantics-live
          path: weather-maker-trade-semantics-live.json
          if-no-files-found: error
