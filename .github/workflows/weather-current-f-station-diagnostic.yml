name: weather-current-f-station-diagnostic

on:
  push:
    branches:
      - weather-three-layer-live-grammar-corrective-2026-09-15
    paths:
      - '.github/workflows/weather-current-f-station-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Enumerate current same-day Fahrenheit NOAA/WRH station pairs read-only
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import json
          import re
          from datetime import date
          from pathlib import Path

          from polymarket_scanner.weather_only_contracts import (
              DAILY_HIGH,
              DAILY_LOW,
              compile_weather_event,
          )
          from polymarket_scanner.weather_only_contract_strict import (
              StrictWeatherContractError,
              compile_strict_temperature_event,
          )
          from polymarket_scanner.weather_only_discovery import WeatherOnlyDiscovery

          STATION_NAME = re.compile(
              r"temperature recorded by NOAA at the (.+?) Station in degrees Fahrenheit",
              re.I,
          )

          async def run():
              discovery = WeatherOnlyDiscovery()
              try:
                  snapshot = await discovery.discover()
              finally:
                  await discovery.close()
              rows = []
              for event in snapshot.events:
                  if not isinstance(event, dict):
                      continue
                  try:
                      broad = compile_weather_event(event)
                  except Exception:
                      continue
                  if broad.family not in {DAILY_HIGH, DAILY_LOW}:
                      continue
                  if broad.unit != 'F' or broad.target_date != date(2026, 9, 15):
                      continue
                  desc = str(event.get('description') or '')
                  match = STATION_NAME.search(desc)
                  display = match.group(1).strip() if match else None
                  try:
                      compile_strict_temperature_event(event)
                      strict = 'ACCEPT'
                  except StrictWeatherContractError as exc:
                      strict = str(exc.code)
                  rows.append({
                      'event_id': str(broad.event_id),
                      'title': str(event.get('title') or ''),
                      'family': str(broad.family),
                      'station_code': str(broad.station_hint or '').upper(),
                      'station_display_name': display,
                      'strict': strict,
                  })
              rows.sort(key=lambda row: (row['station_code'], row['family'], row['event_id']))
              report = {
                  'date': '2026-09-15',
                  'unit': 'F',
                  'read_only': True,
                  'telegram_delivery': False,
                  'clob_requests': False,
                  'automatic_order_placement': False,
                  'rows': rows,
              }
              Path('weather-current-f-stations.json').write_text(
                  json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
              print(json.dumps(report, indent=2, sort_keys=True))

          asyncio.run(run())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weather-current-f-stations-${{ github.sha }}
          path: weather-current-f-stations.json
          if-no-files-found: error
