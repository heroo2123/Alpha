name: weather-production-execution-public-probe
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - weather-production-integration-2026-09-16
permissions:
  contents: read
jobs:
  public-contract-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-execution-hashed.txt
      - name: Read public finalized chain and deployed exchange fee limits without an account
        run: python -m tools.production_public_execution_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-public-execution-${{ github.sha }}
          path: production-public-execution.json
