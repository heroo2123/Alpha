name: weather-wrh-authority-source-gate

on:
  push:
    branches:
      - weather-wrh-calibration-authority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrh-source-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify live WRH viewer source against pinned production semantics
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          import httpx

          from polymarket_scanner.weather_only_wrh import (
              WRH_SYNOPTIC_ENDPOINT,
              WRH_VIEWER_SCRIPT_SHA256,
              WRH_VIEWER_SCRIPT_URL,
          )

          base = 'https://www.weather.gov'
          params = {
              'site': 'KLGA',
              'hours': '48',
              'units': 'english',
              'hourly': 'true',
              'obs': 'tabular',
              'headers': 'none',
              'chart': 'off',
          }
          headers = {
              'User-Agent': 'polymarket-weather-only-wrh-authority-gate/1.0 (+https://github.com/heroo2123/Alpha)',
              'Accept': '*/*',
          }
          with httpx.Client(headers=headers, timeout=20.0, follow_redirects=True) as client:
              page = client.get(base + '/wrh/timeseries', params=params)
              page.raise_for_status()
              match = re.search(
                  r'<script[^>]+src=["\']([^"\']*?/source/wrh/timeseries/obs\.js[^"\']*)',
                  page.text,
                  re.I,
              )
              if not match:
                  raise SystemExit('WRH_VIEWER_SCRIPT_NOT_FOUND')
              script_src = match.group(1)
              script_url = script_src if script_src.startswith('http') else base + script_src
              script = client.get(script_url)
              script.raise_for_status()

          js = script.text
          script_sha = hashlib.sha256(script.content).hexdigest()
          checks = {
              'script_url_pinned': script_url == WRH_VIEWER_SCRIPT_URL,
              'script_sha_pinned': script_sha == WRH_VIEWER_SCRIPT_SHA256,
              'synoptic_endpoint': WRH_SYNOPTIC_ENDPOINT in js,
              'complete_query': 'complete=1' in js,
              'local_timezone_query': 'obtimezone=local' in js,
              'english_fahrenheit_query': 'units=temp|F,speed|mph,english' in js,
              'station_shortname': 'DATA.STATION[0].SHORTNAME' in js,
              'global_metar_normalization': "if (network == 'GLOBAL-METAR')" in js and "network = 'ASOS/AWOS'" in js,
              'station_timezone': 'DATA.STATION[0].TIMEZONE' in js,
              'air_temp_field': 'DATA.STATION[0].OBSERVATIONS.air_temp_set_1' in js,
              'js_round_display': 'Math.round(DATA.STATION[0].OBSERVATIONS.air_temp_set_1[j])' in js,
              'hourly_mode': "if (hourly == 'true')" in js,
              'asos_branch': "if (network == 'ASOS/AWOS')" in js,
              'official_pressure_path': "sea_level_pressure_set_1[j] !== null" in js,
              'speci_station_prefix': ".toUpperCase().startsWith(SITE)" in js,
              'nonfed_minute_51': "minutes.toString() == '51'" in js,
              'nonfed_minute_59': "minutes.toString() == '59'" in js,
          }
          report = {
              'viewer_script_url': script_url,
              'viewer_script_sha256': script_sha,
              'viewer_script_bytes': len(script.content),
              'checks': checks,
              'api_key_script_fetched': False,
              'synoptic_payload_fetched': False,
              'financial_authority': False,
          }
          Path('wrh-authority-source-gate.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          failed = sorted(name for name, ok in checks.items() if not ok)
          if failed:
              raise SystemExit('WRH_SOURCE_SEMANTICS_DRIFT:' + ','.join(failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-wrh-authority-source-${{ github.sha }}
          path: wrh-authority-source-gate.json
          if-no-files-found: warn
