name: weather-maker-ws-side-semantic-gate

on:
  workflow_dispatch:
  push:
    branches:
      - weather-all-paper-signals-2026-09-15
    paths:
      - "polymarket_scanner/weather_only_maker_trade_stream.py"
      - "polymarket_scanner/weather_only_maker_trade_stream_v2.py"
      - ".github/workflows/weather-maker-ws-side-semantic-gate.yml"

permissions:
  contents: read

jobs:
  live-ws-taker-side-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact WebSocket dependency
        run: python -m pip install --disable-pip-version-check websockets==13.1
      - name: Cross-check Market WS side against public taker-only Data API
        run: |
          python - <<'PY'
          import asyncio
          import json
          import time
          import urllib.parse
          import urllib.request

          import websockets

          GAMMA = "https://gamma-api.polymarket.com/markets"
          DATA = "https://data-api.polymarket.com/trades"
          BOOK = "https://clob.polymarket.com/book"
          WS = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
          USER_AGENT = "polymarket-weather-maker-side-semantic-gate/1.0"

          def get_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": USER_AGENT, "Accept": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  assert response.status == 200, (url, response.status)
                  return json.loads(response.read().decode("utf-8", errors="strict"))

          def token_list(raw):
              if isinstance(raw, list):
                  return [str(value) for value in raw if str(value).strip()]
              if isinstance(raw, str):
                  try:
                      value = json.loads(raw)
                  except json.JSONDecodeError:
                      return []
                  if isinstance(value, list):
                      return [str(item) for item in value if str(item).strip()]
              return []

          # Prefer the highest-volume currently open order-book market so the gate is
          # likely to observe a trade during its bounded live window.  This market is
          # used only to certify global CLOB feed semantics; it is not a trading pick.
          query = urllib.parse.urlencode({
              "active": "true",
              "closed": "false",
              "limit": 100,
              "order": "volume24hr",
              "ascending": "false",
          })
          markets = get_json(f"{GAMMA}?{query}")
          assert isinstance(markets, list) and markets, "no active Gamma markets"

          chosen = None
          for market in markets:
              if not isinstance(market, dict):
                  continue
              condition = str(market.get("conditionId") or "").strip().lower()
              tokens = token_list(market.get("clobTokenIds"))
              if (
                  not condition.startswith("0x")
                  or len(condition) != 66
                  or not tokens
                  or market.get("enableOrderBook") is not True
                  or market.get("acceptingOrders") is not True
              ):
                  continue
              live_tokens = []
              for token in tokens:
                  try:
                      book = get_json(f"{BOOK}?{urllib.parse.urlencode({'token_id': token})}")
                  except Exception:
                      continue
                  if isinstance(book, dict) and str(book.get("asset_id") or "") == token:
                      live_tokens.append(token)
              if live_tokens:
                  chosen = (condition, live_tokens[:2], str(market.get("question") or ""))
                  break
          assert chosen is not None, "no live high-volume CLOB market found"
          condition, tokens, question = chosen

          def data_matches(event):
              params = urllib.parse.urlencode({
                  "market": condition,
                  "takerOnly": "true",
                  "limit": 1000,
                  "offset": 0,
              })
              rows = get_json(f"{DATA}?{params}")
              assert isinstance(rows, list), type(rows).__name__
              tx = str(event.get("transaction_hash") or "").lower()
              asset = str(event.get("asset_id") or "")
              side = str(event.get("side") or "").upper()
              price = float(event["price"])
              size = float(event["size"])
              timestamp = int(float(event["timestamp"]) / 1000.0)
              matches = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  if str(row.get("transactionHash") or "").lower() != tx:
                      continue
                  if str(row.get("asset") or "") != asset:
                      continue
                  if abs(float(row.get("price")) - price) > 1e-9:
                      continue
                  if abs(float(row.get("size")) - size) > 1e-6:
                      continue
                  if abs(int(row.get("timestamp")) - timestamp) > 2:
                      continue
                  matches.append(row)
              if not matches:
                  return None
              sides = {str(row.get("side") or "").upper() for row in matches}
              assert sides <= {"BUY", "SELL"}, sides
              assert len(sides) == 1, ("ambiguous taker-only sides", sides)
              data_side = next(iter(sides))
              assert data_side == side, (
                  "WS side does not match taker-only Data API side",
                  side,
                  data_side,
              )
              return {
                  "ws_side": side,
                  "taker_only_data_side": data_side,
                  "matched_rows": len(matches),
              }

          async def observe():
              deadline = time.monotonic() + 150.0
              async with websockets.connect(
                  WS,
                  ping_interval=None,
                  close_timeout=5,
                  open_timeout=10,
                  max_size=2 * 1024 * 1024,
                  max_queue=256,
              ) as ws:
                  await ws.send(json.dumps({
                      "assets_ids": tokens,
                      "type": "market",
                      "custom_feature_enabled": False,
                  }))
                  book_seen = False
                  next_ping = time.monotonic() + 10.0
                  while time.monotonic() < deadline:
                      timeout = max(0.2, min(5.0, deadline - time.monotonic()))
                      try:
                          raw = await asyncio.wait_for(ws.recv(), timeout=timeout)
                      except asyncio.TimeoutError:
                          if time.monotonic() >= next_ping:
                              await ws.send("PING")
                              next_ping = time.monotonic() + 10.0
                          continue
                      if raw == "PONG":
                          continue
                      payload = json.loads(raw)
                      events = payload if isinstance(payload, list) else [payload]
                      for event in events:
                          if not isinstance(event, dict):
                              continue
                          if event.get("event_type") == "book" and str(event.get("asset_id")) in tokens:
                              book_seen = True
                              continue
                          if event.get("event_type") != "last_trade_price":
                              continue
                          if str(event.get("asset_id") or "") not in tokens:
                              continue
                          assert book_seen, "trade arrived before subscription book coverage"
                          assert str(event.get("market") or "").lower() == condition
                          assert str(event.get("side") or "").upper() in {"BUY", "SELL"}
                          assert float(event.get("size")) > 0.0
                          assert 0.0 < float(event.get("price")) < 1.0
                          assert float(event.get("timestamp")) > 0.0
                          tx = str(event.get("transaction_hash") or "").strip()
                          if not tx:
                              # Current SDK allows a nullable hash.  A hashless print is
                              # valid feed data but cannot support this cross-source gate.
                              continue
                          for attempt in range(8):
                              matched = await asyncio.to_thread(data_matches, event)
                              if matched is not None:
                                  return event, matched, book_seen
                              await asyncio.sleep(2.0 + attempt * 0.5)
                      if time.monotonic() >= next_ping:
                          await ws.send("PING")
                          next_ping = time.monotonic() + 10.0
              raise AssertionError("no cross-source-verifiable live trade observed within 150 seconds")

          event, matched, book_seen = asyncio.run(observe())
          report = {
              "version": "weather_maker_ws_side_semantic_gate_v1",
              "condition_id": condition,
              "question": question,
              "subscribed_tokens": tokens,
              "book_seen_before_trade": bool(book_seen),
              "transaction_hash_present": bool(str(event.get("transaction_hash") or "")),
              "ws_side": matched["ws_side"],
              "public_data_api_taker_only": True,
              "taker_only_data_side": matched["taker_only_data_side"],
              "matched_rows": matched["matched_rows"],
              "aggressor_side_semantics_verified": True,
              "authenticated_channel_used": False,
              "actual_order_placed": False,
              "actual_fill_authority": False,
              "financial_authority": False,
          }
          with open("weather-maker-ws-side-semantic-gate.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, sort_keys=True, indent=2)
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weather-maker-ws-side-semantic-gate
          path: weather-maker-ws-side-semantic-gate.json
