name: weather-wrh-exact-source-probe

on:
  push:
    branches:
      - weather-wrh-exact-settlement-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrh-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Certify official WRH transport, display transform and hourly predicate
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          import httpx

          base = 'https://www.weather.gov'
          page_url = base + '/wrh/timeseries'
          params = {
              'site': 'KLGA',
              'hours': '48',
              'units': 'english',
              'hourly': 'true',
              'obs': 'tabular',
              'headers': 'none',
              'chart': 'off',
          }
          headers = {
              'User-Agent': 'polymarket-weather-only-wrh-probe/0.3 (+https://github.com/heroo2123/Alpha)',
              'Accept': '*/*',
          }
          with httpx.Client(headers=headers, timeout=20.0, follow_redirects=True) as client:
              page = client.get(page_url, params=params)
              page.raise_for_status()
              body = page.text
              script_match = re.search(
                  r'<script[^>]+src=["\']([^"\']*?/source/wrh/timeseries/obs\.js[^"\']*)',
                  body,
                  re.I,
              )
              if not script_match:
                  raise SystemExit('WRH viewer obs.js script not found')
              script_src = script_match.group(1)
              script_url = script_src if script_src.startswith('http') else base + script_src
              obs = client.get(script_url)
              obs.raise_for_status()
              js = obs.text

          lines = js.splitlines()
          def block(start, end):
              # 1-based inclusive line range, redacted defensively.
              text = '\n'.join(lines[start-1:end])
              text = re.sub(
                  r'(?i)(?:token|apikey|api_key|key)(\s*[=:]\s*["\'])[^"\']+(["\'])',
                  r'\1<REDACTED>\2',
                  text,
              )
              text = re.sub(
                  r'(?i)((?:token|apikey|api_key|key)=)[^&\s"\']+',
                  r'\1<REDACTED>',
                  text,
              )
              return text

          transport = block(286, 316)
          metadata = block(309, 352)
          temperature = block(365, 384)
          hourly = block(1748, 1810)

          # Fail if the exact semantics we are depending on are no longer present.
          required = {
              'synoptic_timeseries': 'api.synopticdata.com/v2/stations/timeseries' in transport,
              'complete_1': 'complete=1' in transport,
              'local_timezone': 'obtimezone=local' in transport,
              'station_identity': 'DATA.STATION[0].STID' in metadata,
              'station_network': 'DATA.STATION[0].MNET_SHORTNAME' in metadata,
              'station_timezone': 'DATA.STATION[0].TIMEZONE' in temperature or 'DATA.STATION[0].TIMEZONE' in hourly,
              'temperature_field': 'air_temp_set_1' in temperature,
              'whole_degree_display': 'Math.round(DATA.STATION[0].OBSERVATIONS.air_temp_set_1[j])' in temperature,
              'hourly_flag': "if (hourly == 'true')" in hourly,
              'asos_network_branch': "network == 'ASOS/AWOS'" in hourly,
              'minutes_reference': 'minutes' in hourly,
          }
          if not all(required.values()):
              raise SystemExit(f'WRH source semantics drift: {required}')

          report = {
              'viewer_script_url': script_url,
              'viewer_script_sha256': hashlib.sha256(obs.content).hexdigest(),
              'viewer_script_bytes': len(obs.content),
              'viewer_script_line_count': len(lines),
              'certified_checks': required,
              'transport_block': transport,
              'metadata_block': metadata,
              'temperature_block': temperature,
              'hourly_block': hourly,
              'api_key_script_fetched': False,
          }
          Path('wrh-hourly-semantics.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-wrh-hourly-semantics-${{ github.sha }}
          path: wrh-hourly-semantics.json
          if-no-files-found: warn
