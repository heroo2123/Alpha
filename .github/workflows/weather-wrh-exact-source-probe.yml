name: weather-wrh-exact-source-probe

on:
  push:
    branches:
      - weather-wrh-exact-settlement-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrh-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Capture official WRH transport, metadata, display and hourly blocks
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          import httpx

          base = 'https://www.weather.gov'
          params = {
              'site': 'KLGA', 'hours': '48', 'units': 'english', 'hourly': 'true',
              'obs': 'tabular', 'headers': 'none', 'chart': 'off',
          }
          headers = {
              'User-Agent': 'polymarket-weather-only-wrh-probe/0.4 (+https://github.com/heroo2123/Alpha)',
              'Accept': '*/*',
          }
          with httpx.Client(headers=headers, timeout=20.0, follow_redirects=True) as client:
              page = client.get(base + '/wrh/timeseries', params=params)
              page.raise_for_status()
              match = re.search(
                  r'<script[^>]+src=["\']([^"\']*?/source/wrh/timeseries/obs\.js[^"\']*)',
                  page.text, re.I,
              )
              if not match:
                  raise SystemExit('WRH viewer obs.js script not found')
              script_src = match.group(1)
              script_url = script_src if script_src.startswith('http') else base + script_src
              obs = client.get(script_url)
              obs.raise_for_status()

          lines = obs.text.splitlines()
          def block(start, end):
              text = '\n'.join(lines[start-1:end])
              text = re.sub(
                  r'(?i)(?:token|apikey|api_key|key)(\s*[=:]\s*["\'])[^"\']+(["\'])',
                  r'\1<REDACTED>\2', text,
              )
              text = re.sub(
                  r'(?i)((?:token|apikey|api_key|key)=)[^&\s"\']+',
                  r'\1<REDACTED>', text,
              )
              return text

          report = {
              'viewer_script_url': script_url,
              'viewer_script_sha256': hashlib.sha256(obs.content).hexdigest(),
              'viewer_script_bytes': len(obs.content),
              'viewer_script_line_count': len(lines),
              'transport_block': block(286, 316),
              'metadata_block': block(309, 370),
              'temperature_block': block(365, 384),
              'hourly_block': block(1748, 1815),
              'api_key_script_fetched': False,
          }
          # Only certify what is already directly established. Detailed metadata and
          # hourly predicates are inspected from the artifact before being frozen.
          basic_checks = {
              'synoptic_timeseries': 'api.synopticdata.com/v2/stations/timeseries' in report['transport_block'],
              'complete_1': 'complete=1' in report['transport_block'],
              'local_timezone': 'obtimezone=local' in report['transport_block'],
              'station_identity': 'DATA.STATION[0].STID' in report['metadata_block'],
              'temperature_field': 'air_temp_set_1' in report['temperature_block'],
              'whole_degree_display': 'Math.round(DATA.STATION[0].OBSERVATIONS.air_temp_set_1[j])' in report['temperature_block'],
              'hourly_flag': "if (hourly == 'true')" in report['hourly_block'],
              'asos_network_branch': "network == 'ASOS/AWOS'" in report['hourly_block'],
              'minutes_reference': 'minutes' in report['hourly_block'],
          }
          report['basic_checks'] = basic_checks
          Path('wrh-hourly-semantics.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if not all(basic_checks.values()):
              raise SystemExit(f'WRH basic source semantics drift: {basic_checks}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-wrh-hourly-semantics-${{ github.sha }}
          path: wrh-hourly-semantics.json
          if-no-files-found: warn
