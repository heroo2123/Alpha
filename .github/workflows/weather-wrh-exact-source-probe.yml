name: weather-wrh-exact-source-probe

on:
  push:
    branches:
      - weather-wrh-exact-settlement-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrh-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect official WRH shell and viewer transport code
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          import httpx

          base = 'https://www.weather.gov'
          page_url = base + '/wrh/timeseries'
          params = {
              'site': 'KLGA',
              'hours': '48',
              'units': 'english',
              'hourly': 'true',
              'obs': 'tabular',
              'headers': 'none',
              'chart': 'off',
          }
          headers = {
              'User-Agent': 'polymarket-weather-only-wrh-probe/0.2 (+https://github.com/heroo2123/Alpha)',
              'Accept': '*/*',
          }
          with httpx.Client(headers=headers, timeout=20.0, follow_redirects=True) as client:
              page = client.get(page_url, params=params)
              page.raise_for_status()
              body = page.text
              script_match = re.search(
                  r'<script[^>]+src=["\']([^"\']*?/source/wrh/timeseries/obs\.js[^"\']*)',
                  body,
                  re.I,
              )
              if not script_match:
                  raise SystemExit('WRH viewer obs.js script not found')
              script_src = script_match.group(1)
              script_url = script_src if script_src.startswith('http') else base + script_src
              obs = client.get(script_url)
              obs.raise_for_status()
              js = obs.text

          # Extract only transport/transform context; never fetch or print apiKey.js.
          patterns = (
              r'api\.synopticdata[^\s"\']*',
              r'synopticdata[^\s"\']*',
              r'mesowest[^\s"\']*',
              r'fetch\s*\(',
              r'\$\.ajax',
              r'\$\.getJSON',
              r'XMLHttpRequest',
              r'apiKey',
              r'token',
              r'stid',
              r'vars=',
              r'obtimezone',
              r'date_time',
              r'air_temp',
              r'hourly',
              r'qc=',
              r'units=',
          )
          hits = []
          lines = js.splitlines()
          for index, line in enumerate(lines):
              if any(re.search(pattern, line, re.I) for pattern in patterns):
                  start = max(0, index - 3)
                  end = min(len(lines), index + 5)
                  excerpt = '\n'.join(lines[start:end])
                  # Redact common key/token assignment/query forms defensively.
                  excerpt = re.sub(
                      r'(?i)(?:token|apikey|api_key|key)(\s*[=:]\s*["\'])[^"\']+(["\'])',
                      r'\1<REDACTED>\2',
                      excerpt,
                  )
                  excerpt = re.sub(
                      r'(?i)((?:token|apikey|api_key|key)=)[^&\s"\']+',
                      r'\1<REDACTED>',
                      excerpt,
                  )
                  hits.append({'line': index + 1, 'excerpt': excerpt})

          # De-duplicate overlapping excerpts while preserving order.
          unique = []
          seen = set()
          for hit in hits:
              key = hit['excerpt']
              if key not in seen:
                  seen.add(key)
                  unique.append(hit)

          report = {
              'page_url': str(page.url),
              'page_status': page.status_code,
              'page_body_bytes': len(page.content),
              'page_body_sha256': hashlib.sha256(page.content).hexdigest(),
              'viewer_script_url': script_url,
              'viewer_script_status': obs.status_code,
              'viewer_script_bytes': len(obs.content),
              'viewer_script_sha256': hashlib.sha256(obs.content).hexdigest(),
              'viewer_script_line_count': len(lines),
              'transport_context': unique,
              'api_key_script_fetched': False,
          }
          Path('wrh-transport-probe.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if not unique:
              raise SystemExit('WRH transport/transform code not located')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-wrh-transport-${{ github.sha }}
          path: wrh-transport-probe.json
          if-no-files-found: warn
