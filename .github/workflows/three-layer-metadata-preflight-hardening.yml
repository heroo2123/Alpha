name: three-layer-metadata-preflight-hardening

on:
  push:
    branches:
      - weather-three-layer-dst-hardening-2026-09-15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'Require guarded fallback metadata in deployment preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted preflight fix
        run: python tools/apply_three_layer_metadata_preflight_fix.py
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused tests and live read-only preflight
        run: |
          python -m pytest -q tests/test_weather_only_network_preflight.py tests/test_weather_only_three_layer_validation_guarded.py
          python -m polymarket_scanner.weather_only_network_preflight >/tmp/network-preflight.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/network-preflight.json'))
          assert data['required_passed'] is True
          names={p['name']:p for p in data['probes']}
          assert names['wrh_station_metadata_fallback']['ok'] is True
          assert names['nws_station_metadata']['ok'] is True
          print('GUARDED_METADATA_PREFLIGHT_PASS')
          PY
          python -m compileall -q polymarket_scanner deploy
      - name: Commit reviewed fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add polymarket_scanner/weather_only_network_preflight.py tests/test_weather_only_network_preflight.py
          git diff --cached --check
          git commit -m 'Require guarded fallback metadata in deployment preflight'
          git push origin HEAD:weather-three-layer-dst-hardening-2026-09-15
