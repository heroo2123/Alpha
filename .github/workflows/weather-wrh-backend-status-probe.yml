name: weather-wrh-backend-status-probe

on:
  push:
    branches:
      - weather-wrh-live-client
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.27.2
      - name: Probe backend browser authorization context only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import httpx

          shell_url = 'https://www.weather.gov/wrh/timeseries'
          key_url = 'https://www.weather.gov/source/wrh/apiKey.js'
          endpoint = 'https://api.synopticdata.com/v2/stations/timeseries'
          base_headers = {'User-Agent':'wrh-secret-safe-status-probe/1.2','Accept':'*/*'}

          with httpx.Client(timeout=20.0, follow_redirects=True, headers=base_headers) as client:
              shell = client.get(shell_url, params={
                  'site':'KLGA','hours':'48','units':'english','hourly':'true',
                  'obs':'tabular','headers':'none','chart':'off',
              })
              key_script = client.get(key_url)
              if shell.status_code != 200 or key_script.status_code != 200:
                  print(json.dumps({
                      'shell_status': shell.status_code,
                      'key_script_status': key_script.status_code,
                      'credential_value_printed': False,
                  }, sort_keys=True))
                  raise SystemExit('WRH_SOURCE_FETCH_FAILED')

              matches = re.findall(
                  r"(?i)(?:\b(?:var|let|const)\s+)?\bmesoToken\s*=\s*['\"]([^'\"]+)['\"]",
                  key_script.text,
              )
              unique = list(dict.fromkeys(value.strip() for value in matches))
              if len(unique) != 1:
                  raise SystemExit('WRH_MESOTOKEN_SHAPE_INVALID')
              secret = unique[0]

              tz = ZoneInfo('America/New_York')
              target = datetime.now(tz).date() - timedelta(days=1)
              following = target + timedelta(days=1)
              params = {
                  'STID':'KLGA',
                  'showemptystations':'1',
                  'units':'temp|F,speed|mph,english',
                  'start':target.strftime('%Y%m%d')+'0000',
                  'end':following.strftime('%Y%m%d')+'2359',
                  'complete':'1',
                  'token':secret,
                  'obtimezone':'local',
              }
              referer = shell_url + '?site=KLGA&hours=48&units=english&hourly=true&obs=tabular&headers=none&chart=off'
              no_context = client.get(endpoint, params=params)
              origin_only = client.get(endpoint, params=params, headers={'Origin':'https://www.weather.gov'})
              referer_only = client.get(endpoint, params=params, headers={'Referer':referer})
              browser_context = client.get(endpoint, params=params, headers={
                  'Origin':'https://www.weather.gov',
                  'Referer':referer,
                  'Sec-Fetch-Site':'cross-site',
                  'Sec-Fetch-Mode':'cors',
                  'Sec-Fetch-Dest':'empty',
              })

          report = {
              'shell_status': shell.status_code,
              'key_script_status': key_script.status_code,
              'no_context_status': no_context.status_code,
              'origin_only_status': origin_only.status_code,
              'referer_only_status': referer_only.status_code,
              'browser_context_status': browser_context.status_code,
              'credential_value_printed': False,
              'request_url_printed': False,
              'response_body_printed': False,
              'raw_payload_persisted': False,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
