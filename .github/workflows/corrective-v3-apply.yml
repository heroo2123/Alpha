name: corrective-v3-apply-once

on:
  push:
    branches:
      - weather-all-paper-post-final-review-corrective-2026-09-16
    paths:
      - .github/workflows/corrective-v3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply corrective v3 integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile .corrective_v3_codegen.py
          python .corrective_v3_codegen.py
          rm -f .corrective_v3_codegen.py
          chmod +x deploy/*.sh host_trust/weather-paper-authority-v2/*.sh host_trust/weather-paper-authority-v3/*.sh
          python -m compileall -q polymarket_scanner deploy tests host_trust
          for script in deploy/*.sh deploy/gcp/*.sh deploy/oracle/*.sh host_trust/weather-paper-authority-v2/*.sh host_trust/weather-paper-authority-v3/*.sh; do
            bash -n "$script"
          done
      - name: Commit integrated corrective architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/corrective-v3-apply.yml'
          git diff --cached --check
          git commit -m 'Integrate immutable host authority v3 and terminal corrections'
          git push origin HEAD:weather-all-paper-post-final-review-corrective-2026-09-16
