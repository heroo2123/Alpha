name: three-layer-live-universe-probe

on:
  push:
    branches:
      - weather-three-layer-dst-hardening-2026-09-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect exact labels for remaining live station-name variants
        run: |
          python - <<'PY'
          import asyncio
          from polymarket_scanner.weather_only_discovery import WeatherOnlyDiscovery
          from polymarket_scanner.weather_only_contracts import compile_weather_event
          TARGETS = ('1008233','1009004','1009013')
          async def main():
              d=WeatherOnlyDiscovery()
              try:
                  s=await d.discover()
                  by={str(e.get('id') or ''):e for e in s.events if isinstance(e,dict)}
                  for eid in TARGETS:
                      e=by[eid]; raw=compile_weather_event(e)
                      print('BEGIN='+eid)
                      print('IDENTITY='+repr((raw.title,raw.station_hint,raw.unit)))
                      print(str(e.get('description') or ''))
                      print('END='+eid)
              finally:
                  await d.close()
          asyncio.run(main())
          PY
