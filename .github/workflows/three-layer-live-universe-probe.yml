name: three-layer-live-universe-probe

on:
  push:
    branches:
      - weather-three-layer-dst-hardening-2026-09-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect exact Fahrenheit and Celsius recurring templates
        run: |
          python - <<'PY'
          import asyncio
          from polymarket_scanner.weather_only_discovery import WeatherOnlyDiscovery
          from polymarket_scanner.weather_only_contracts import compile_weather_event

          TARGETS = ('1009003', '1009108', '1017810', '1018007')

          async def main():
              d = WeatherOnlyDiscovery()
              try:
                  s = await d.discover()
                  by_id = {str(e.get('id') or ''): e for e in s.events if isinstance(e, dict)}
                  for event_id in TARGETS:
                      e = by_id.get(event_id)
                      if e is None:
                          print('MISSING=' + event_id)
                          continue
                      raw = compile_weather_event(e)
                      markets = [m for m in (e.get('markets') or []) if isinstance(m, dict)]
                      print('BEGIN=' + event_id)
                      print('IDENTITY=' + repr((raw.title, raw.family, raw.target_date.isoformat() if raw.target_date else None, raw.unit, raw.station_hint)))
                      print('SOURCE=' + str(e.get('resolutionSource') or ''))
                      print('DESCRIPTION_BEGIN')
                      print(str(e.get('description') or ''))
                      print('DESCRIPTION_END')
                      print('QUESTIONS=' + repr([str(m.get('question') or '') for m in markets]))
                      print('END=' + event_id)
              finally:
                  await d.close()

          asyncio.run(main())
          PY
