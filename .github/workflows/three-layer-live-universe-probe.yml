name: three-layer-live-universe-probe

on:
  push:
    branches:
      - weather-three-layer-dst-hardening-2026-09-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect exact live rule grammar and guarded Layer 2 geography
        run: |
          python - <<'PY'
          import asyncio
          from collections import Counter

          from polymarket_scanner.weather_only_discovery import WeatherOnlyDiscovery
          from polymarket_scanner.weather_only_contracts import DAILY_HIGH, DAILY_LOW, compile_weather_event
          from polymarket_scanner.weather_only_contract_strict import compile_strict_temperature_event
          from polymarket_scanner.weather_only_three_layer_guarded import (
              GuardedNWSNearTermGridClient,
              GuardedSameDayStationMetadataClient,
          )

          TARGET_IDS = {'1008202', '1008203', '1008208', '1008214', '1008334', '1008346'}
          PROBE_STATIONS = ('KLGA', 'EGLC', 'LFPB', 'EDDM', 'LIMC')

          def code(exc):
              return str(getattr(exc, 'code', type(exc).__name__))

          async def main():
              discovery = WeatherOnlyDiscovery()
              stations = GuardedSameDayStationMetadataClient()
              near = GuardedNWSNearTermGridClient()
              try:
                  snapshot = await discovery.discover()
                  by_id = {str(e.get('id') or ''): e for e in snapshot.events if isinstance(e, dict)}
                  strict_errors = Counter()
                  raw_nws = []
                  for event in snapshot.events:
                      if not isinstance(event, dict):
                          continue
                      raw = compile_weather_event(event)
                      if raw.family in {DAILY_HIGH, DAILY_LOW} and raw.source_family == 'NWS_WRH_TIMESERIES':
                          raw_nws.append(raw)
                      try:
                          compile_strict_temperature_event(event)
                      except Exception as exc:
                          strict_errors[code(exc)] += 1
                  print(f'DISCOVERED_UNIQUE_EVENTS={snapshot.unique_event_count}')
                  print(f'RAW_NWS_WRH_TEMPERATURE_EVENTS={len(raw_nws)}')
                  print('STRICT_ERRORS=' + repr(dict(strict_errors.most_common())))

                  for event_id in sorted(TARGET_IDS):
                      event = by_id.get(event_id)
                      if event is None:
                          print(f'TARGET_EVENT_MISSING={event_id}')
                          continue
                      markets = [m for m in (event.get('markets') or []) if isinstance(m, dict)]
                      raw = compile_weather_event(event)
                      try:
                          compile_strict_temperature_event(event)
                          strict = 'OK'
                      except Exception as exc:
                          strict = code(exc)
                      print('LIVE_EVENT_BEGIN=' + event_id)
                      print('TITLE=' + str(event.get('title') or ''))
                      print('SLUG=' + str(event.get('slug') or ''))
                      print('SOURCE=' + str(event.get('resolutionSource') or ''))
                      print('RAW_IDENTITY=' + repr({
                          'family': raw.family,
                          'date': None if raw.target_date is None else raw.target_date.isoformat(),
                          'unit': raw.unit,
                          'source_family': raw.source_family,
                          'station': raw.station_hint,
                          'buckets': len(raw.buckets or ()),
                          'shape': raw.partition_shape_complete,
                      }))
                      print('STRICT_RESULT=' + strict)
                      print('DESCRIPTION_BEGIN')
                      print(str(event.get('description') or ''))
                      print('DESCRIPTION_END')
                      for index, market in enumerate(markets):
                          print(f'QUESTION[{index}]=' + str(market.get('question') or ''))
                      print('LIVE_EVENT_END=' + event_id)

                  for station in PROBE_STATIONS:
                      try:
                          meta = await stations.station(station)
                          print('STATION_METADATA_OK=' + repr({
                              'station': station,
                              'resolved_station': meta.station,
                              'timezone': meta.timezone,
                              'latitude': meta.latitude,
                              'longitude': meta.longitude,
                          }))
                      except Exception as exc:
                          print(f'STATION_METADATA_FAIL={station}|{code(exc)}')
                          continue
                      try:
                          snap = await near.fetch_snapshot(
                              station=station,
                              latitude=float(meta.latitude),
                              longitude=float(meta.longitude),
                          )
                          print('LAYER2_OK=' + repr({
                              'station': station,
                              'grid': snap.forecast_grid_url,
                              'received_at': snap.received_at,
                          }))
                      except Exception as exc:
                          print(f'LAYER2_FAIL={station}|{code(exc)}')
              finally:
                  await discovery.close()
                  await stations.close()
                  await near.close()

          asyncio.run(main())
          PY
