name: three-layer-live-universe-probe

on:
  push:
    branches:
      - weather-three-layer-dst-hardening-2026-09-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Print exact remaining current WRH rule variants
        run: |
          python - <<'PY'
          import asyncio
          from polymarket_scanner.weather_only_discovery import WeatherOnlyDiscovery
          from polymarket_scanner.weather_only_contracts import DAILY_HIGH, DAILY_LOW, compile_weather_event

          TARGETS = (
              '1008215','1008353','1010316','1010462','1017821','1017825',
              '1017835','1017853','1017854','1017855','1018081','1018159'
          )

          async def main():
              d = WeatherOnlyDiscovery()
              try:
                  s = await d.discover()
                  by_id = {str(e.get('id') or ''): e for e in s.events if isinstance(e, dict)}
                  for event_id in TARGETS:
                      event = by_id.get(event_id)
                      if event is None:
                          print('MISSING=' + event_id)
                          continue
                      raw = compile_weather_event(event)
                      print('BEGIN=' + event_id)
                      print('IDENTITY=' + repr((raw.title, raw.family, raw.target_date.isoformat() if raw.target_date else None, raw.unit, raw.station_hint)))
                      print('SOURCE=' + str(event.get('resolutionSource') or ''))
                      print('DESCRIPTION_BEGIN')
                      print(str(event.get('description') or ''))
                      print('DESCRIPTION_END')
                      print('END=' + event_id)
              finally:
                  await d.close()

          asyncio.run(main())
          PY
