name: weather-maker-data-v2-contract

on:
  workflow_dispatch:
  push:
    branches:
      - weather-maker-vacuum-foundation
    paths:
      - "polymarket_scanner/weather_only_trade_feed.py"
      - "tests/test_weather_only_trade_feed*.py"
      - ".github/workflows/weather-maker-data-v2-contract.yml"

permissions:
  contents: read

jobs:
  live-data-v2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify documented Data API v2 trade contract and anonymous rejection
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          DOCS = "https://docs.polymarket.com/api-reference/feeds/list-trades"
          OPENAPI = "https://data-api.polymarket.com/v2/openapi.json"
          TRADES = "https://data-api.polymarket.com/v2/trades?limit=1&taker_only=true&filter_type=TOKENS&filter_amount=0.01"

          def status(url: str) -> int:
              request = urllib.request.Request(url, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return int(response.status)
              except urllib.error.HTTPError as exc:
                  return int(exc.code)

          # Mintlify's endpoint page is public even when the Data API production edge
          # blocks anonymous GitHub-runner traffic. Verify the human-facing contract
          # without pretending that an unauthenticated payload proves the feed itself.
          docs_request = urllib.request.Request(DOCS, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(docs_request, timeout=15) as response:
              assert response.status == 200
              docs = response.read().decode("utf-8", errors="strict")
          required_fragments = (
              "data-api.polymarket.com/v2/trades",
              "Authorization",
              "Bearer",
              "cursor",
              "taker_only",
              "filter_type",
              "filter_amount",
              "condition",
              "next_cursor",
          )
          missing = [fragment for fragment in required_fragments if fragment not in docs]
          assert not missing, missing

          openapi_status = status(OPENAPI)
          anonymous_status = status(TRADES)
          # Current production may distinguish missing bearer from automated/WAF traffic
          # as 401 vs 403. Either is a fail-closed anonymous rejection; a 200 would mean
          # the auth boundary changed and this gate must be reviewed before relying on it.
          assert openapi_status in {401, 403}, openapi_status
          assert anonymous_status in {401, 403}, anonymous_status

          report = {
              "documentation_contract_verified": True,
              "trade_path": "/v2/trades",
              "cursor_only_expected": True,
              "max_page_size_expected": 1000,
              "openapi_anonymous_status": openapi_status,
              "trades_anonymous_status": anonymous_status,
              "anonymous_access_rejected": True,
              "authenticated_live_payload_verified": False,
              "actual_fill_authority": False,
              "financial_authority": False,
          }
          with open("weather-maker-data-v2-contract.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, sort_keys=True, indent=2)
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weather-maker-data-v2-contract
          path: weather-maker-data-v2-contract.json
