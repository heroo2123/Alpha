name: weather-maker-data-v2-contract

on:
  workflow_dispatch:
  push:
    branches:
      - weather-all-paper-signals-2026-09-15
    paths:
      - "polymarket_scanner/weather_only_trade_feed_public_v2.py"
      - "tests/test_weather_trade_feed_public_v2.py"
      - ".github/workflows/weather-maker-data-v2-contract.yml"

permissions:
  contents: read

jobs:
  live-public-trade-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current public Data API trade contract
        run: |
          python - <<'PY'
          import json
          import urllib.request

          DOCS = "https://docs.polymarket.com/api-reference/core/get-trades-for-a-user-or-markets"
          DATA = (
              "https://data-api.polymarket.com/trades"
              "?limit=5&offset=0&takerOnly=true&filterType=TOKENS&filterAmount=0.01"
          )
          AUTH_CLOB_DOCS = "https://docs.polymarket.com/api-reference/trade/get-trades"

          def get_text(url: str) -> tuple[int, bytes]:
              request = urllib.request.Request(
                  url,
                  method="GET",
                  headers={
                      "User-Agent": "Mozilla/5.0 weather-maker-contract-gate/2.1",
                      "Accept": "application/json,text/html;q=0.9,*/*;q=0.8",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return int(response.status), response.read()

          docs_status, docs_raw = get_text(DOCS)
          assert docs_status == 200, docs_status
          docs = docs_raw.decode("utf-8", errors="strict")
          required_docs = (
              "data-api.polymarket.com/trades",
              "takerOnly",
              "filterType",
              "filterAmount",
              "conditionId",
              "transactionHash",
              "proxyWallet",
              "offset",
          )
          missing = [value for value in required_docs if value not in docs]
          assert not missing, ("public docs drift", missing)

          auth_status, auth_raw = get_text(AUTH_CLOB_DOCS)
          assert auth_status == 200, auth_status
          auth_docs = auth_raw.decode("utf-8", errors="strict")
          # The separately documented CLOB user-trades route is authenticated. Do not
          # require a rendered absolute URL: Mintlify currently renders the path
          # separately, but it does expose the auth headers and authenticated wording.
          for fragment in ("POLY_API_KEY", "POLY_SIGNATURE", "authenticated user"):
              assert fragment in auth_docs, fragment

          data_status, data_raw = get_text(DATA)
          assert data_status == 200, data_status
          payload = json.loads(data_raw.decode("utf-8", errors="strict"))
          assert isinstance(payload, list), type(payload).__name__
          assert 1 <= len(payload) <= 5, len(payload)
          required_row = {
              "proxyWallet", "side", "asset", "conditionId", "size", "price",
              "timestamp", "outcome", "outcomeIndex", "transactionHash",
          }
          for row in payload:
              assert isinstance(row, dict), type(row).__name__
              absent = required_row - set(row)
              assert not absent, ("row schema drift", sorted(absent))
              assert row["side"] in {"BUY", "SELL"}, row["side"]
              assert str(row["conditionId"]).startswith("0x")
              assert str(row["asset"]).strip()
              assert str(row["transactionHash"]).startswith("0x")
              assert float(row["size"]) > 0
              assert 0 < float(row["price"]) < 1
              assert int(row["timestamp"]) > 0

          report = {
              "documentation_contract_verified": True,
              "public_trade_url": "https://data-api.polymarket.com/trades",
              "public_data_api_http_status": data_status,
              "public_data_api_anonymous_access": True,
              "schema": "camelCase array",
              "pagination": "offset_limit",
              "taker_only_requested": True,
              "sample_rows": len(payload),
              "authenticated_clob_trade_route_kept_separate": True,
              "actual_fill_authority": False,
              "financial_authority": False,
          }
          with open("weather-maker-data-v2-contract.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, sort_keys=True, indent=2)
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weather-maker-data-v2-contract
          path: weather-maker-data-v2-contract.json
