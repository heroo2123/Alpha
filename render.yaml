services:
  - type: web
    name: polymarket-edge-scanner
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "20"
      - key: UNIVERSE_REFRESH_SECONDS
        value: "120"
      - key: WEATHER_REFRESH_SECONDS
        value: "60"
      - key: ACTIONABLE_MIN_EDGE
        value: "0.025"
      - key: PAPER_STAKE_USD
        value: "100"
      - key: DB_PATH
        value: /var/data/signals.db
    disk:
      name: polymarket-scanner-data
      mountPath: /var/data
      sizeGB: 1
