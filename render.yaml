services:
  - type: web
    name: polymarket-edge-scanner
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python -c "from polymarket_scanner.trade_only import promoted_detectors; assert promoted_detectors() == (), f'P0 containment violated: {promoted_detectors()}'"
    startCommand: uvicorn app_trade_only:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_COMMANDS_IN_APP
        value: "false"
      - key: SCAN_INTERVAL_SECONDS
        value: "15"
      - key: UNIVERSE_REFRESH_SECONDS
        value: "120"
      - key: WEATHER_REFRESH_SECONDS
        value: "60"
      - key: MACRO_REFRESH_SECONDS
        value: "300"
      - key: ACTIONABLE_MIN_EDGE
        value: "0.025"
      - key: PAPER_STAKE_USD
        value: "100"
      - key: MARKET_WS_ENABLED
        value: "true"
      - key: SPORTS_WS_ENABLED
        value: "true"
      - key: CRYPTO_RTDS_ENABLED
        value: "true"
      - key: KNOWN_OUTCOME_MAX_ASK
        value: "0.975"
      - key: DB_PATH
        value: /var/data/signals.db
    disk:
      name: polymarket-scanner-data
      mountPath: /var/data
      sizeGB: 1
